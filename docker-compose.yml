services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: {{ env('DB_USER') }}
      POSTGRES_PASSWORD: {{ env('DB_PASSWORD') }}
      POSTGRES_DB: {{ env('DB_NAME') }}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: